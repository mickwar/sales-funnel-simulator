[project]
name = "funnel-sim"
version = "0.1.0"
description = "Sales funnel simulator with tunable statistical parameters and automated ML analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38",
    "plotly>=5.24",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "duckdb>=1.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
]
shap = [
    "shap>=0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funnel_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
